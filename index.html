<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHRAE TC 9.9 — Data Center Compliance Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D0F14;
  --bg2: #13161E;
  --bg3: #1A1E28;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #E8EAF0;
  --text2: #8A8FA0;
  --text3: #555A6A;
  --blue: #4B8EF5;
  --blue-dim: rgba(75,142,245,0.12);
  --blue-border: rgba(75,142,245,0.3);
  --green: #3ECF8E;
  --green-dim: rgba(62,207,142,0.1);
  --amber: #F5A623;
  --amber-dim: rgba(245,166,35,0.1);
  --red: #F5564A;
  --red-dim: rgba(245,86,74,0.1);
  --mono: 'DM Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 10px;
  --radius-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  line-height: 1.6;
}
.shell { max-width: 780px; margin: 0 auto; padding: 0 20px 80px; }
.site-header {
  padding: 40px 20px 0;
  max-width: 780px;
  margin: 0 auto 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 36px; height: 36px;
  background: var(--blue);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 20px; height: 20px; fill: #fff; }
.logo-text { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.logo-sub { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-top: 1px; }
.version-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--blue);
  background: var(--blue-dim);
  border: 1px solid var(--blue-border);
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.stepper {
  display: flex;
  align-items: center;
  margin-bottom: 32px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }
.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 64px;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  transition: opacity 0.2s;
}
.step:disabled { cursor: not-allowed; opacity: 0.4; }
.step-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  transition: all 0.25s;
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
}
.step.active .step-dot {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  box-shadow: 0 0 16px rgba(75,142,245,0.4);
}
.step.done .step-dot {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}
.step-name { font-size: 10px; font-family: var(--mono); color: var(--text3); white-space: nowrap; }
.step.active .step-name { color: var(--blue); }
.step.done .step-name { color: var(--green); }
.step-line { flex: 1; height: 1px; background: var(--border); min-width: 12px; max-width: 40px; margin-bottom: 18px; }
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 16px;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-title {
  font-size: 13px;
  font-family: var(--mono);
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::before {
  content: '';
  display: block;
  width: 3px; height: 14px;
  background: var(--blue);
  border-radius: 2px;
}
.section-h {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.section-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.5; }
.req-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.req-tile {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.req-tile-icon { font-size: 20px; margin-bottom: 8px; }
.req-tile-name { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-bottom: 4px; }
.req-tile-range { font-size: 13px; font-weight: 500; color: var(--text); }
.req-tile-cls {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--blue);
  background: var(--blue-dim);
  border: 1px solid var(--blue-border);
  padding: 1px 6px;
  border-radius: 4px;
  margin-top: 6px;
}
.cls-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cls-table th {
  text-align: left;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
}
.cls-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.cls-table tr:last-child td { border-bottom: none; }
.cls-table tr:hover td { background: var(--bg3); }
.cls-badge { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--blue); }
.principles { display: flex; flex-direction: column; gap: 10px; }
.principle {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: border-color 0.2s;
}
.principle:hover { border-color: var(--border2); }
.p-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blue-dim);
  border: 1px solid var(--blue-border);
  color: var(--blue);
  font-family: var(--mono);
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.p-name { font-size: 13px; font-weight: 500; color: var(--text); }
.p-desc { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.5; }
.form-block { margin-bottom: 20px; }
.form-label { font-size: 12px; font-family: var(--mono); color: var(--text2); margin-bottom: 8px; display: block; }
.form-label strong { color: var(--text); font-weight: 500; }
.input-row { display: flex; align-items: center; gap: 10px; }
.input-row input {
  width: 140px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.input-row input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(75,142,245,0.12); }
.input-unit { font-family: var(--mono); font-size: 12px; color: var(--text3); }
.input-hint { font-size: 11px; color: var(--text3); margin-top: 5px; font-family: var(--mono); }
.input-hint span { color: var(--blue); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--blue);
  color: #fff;
  width: 100%;
  justify-content: center;
  margin-top: 8px;
}
.btn-primary:hover { background: #6BA4F7; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(75,142,245,0.3); }
.btn-ghost {
  background: var(--bg3);
  color: var(--text2);
  border: 1px solid var(--border2);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border); }
.nav-row { display: flex; gap: 10px; margin-top: 16px; }
.nav-row .btn-primary { flex: 1; }
.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.sum-tile {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
}
.sum-tile .num { font-size: 28px; font-weight: 700; font-family: var(--mono); }
.sum-tile .lbl { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
.sum-ok .num { color: var(--green); }
.sum-warn .num { color: var(--amber); }
.sum-fail .num { color: var(--red); }
.score-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text2);
}
.score-track { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
.score-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
.result-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.result-card:hover { border-color: var(--border2); }
.rc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.rc-title { font-size: 13px; font-weight: 500; }
.rc-principle { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-top: 2px; }
.status-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 20px;
  font-weight: 500;
  white-space: nowrap;
}
.st-ok { background: rgba(62,207,142,0.12); color: var(--green); border: 1px solid rgba(62,207,142,0.25); }
.st-warn { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,166,35,0.25); }
.st-fail { background: var(--red-dim); color: var(--red); border: 1px solid rgba(245,86,74,0.25); }
.rc-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rc-col { background: var(--bg2); border-radius: 8px; padding: 10px; text-align: center; }
.rc-col-label { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-bottom: 4px; }
.rc-col-val { font-size: 16px; font-weight: 700; font-family: var(--mono); }
.dev-pos { color: var(--green); }
.dev-neg { color: var(--red); }
.dev-zero { color: var(--text3); }
.final-meta {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}
.final-score { font-size: 40px; font-weight: 700; font-family: var(--mono); }
.final-score-label { font-size: 13px; font-weight: 500; }
.final-score-sub { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-top: 3px; }
.comp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.comp-table th {
  text-align: left;
  padding: 9px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.comp-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
.comp-table tr:last-child td { border-bottom: none; }
.comp-table tr:hover td { background: rgba(255,255,255,0.02); }
.comp-table .note { font-size: 11px; font-family: var(--mono); color: var(--text3); margin-top: 14px; line-height: 1.6; }
footer {
  border-top: 1px solid var(--border);
  margin-top: 60px;
  padding: 24px 20px;
  max-width: 780px;
  margin-left: auto;
  margin-right: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
footer p { font-size: 11px; font-family: var(--mono); color: var(--text3); }
@media (max-width: 520px) {
  .req-grid { grid-template-columns: repeat(2, 1fr); }
  .final-meta { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">DC Compliance Analyzer</div>
      <div class="logo-sub">ASHRAE TC 9.9 · Thermal Guidelines</div>
    </div>
  </div>
  <span class="version-tag">v1.0 · 2024</span>
</header>

<main class="shell">
  <nav class="stepper" id="stepper" aria-label="Analysis steps"></nav>
  <div id="screen"></div>
</main>

<footer>
  <p>ASHRAE TC 9.9 Thermal Guidelines for Data Processing Environments, 4th Edition</p>
  <p>Free tool · Open use</p>
</footer>

<script>
const STEPS = [
  { key:'req',   label:'Requirements' },
  { key:'princ', label:'Principles' },
  { key:'data',  label:'Your Data' },
  { key:'anal',  label:'Analysis' },
  { key:'table', label:'Report' },
];

const CLASSES = [
  { cls:'A1', temp:'15–32°C',  hum:'20–80% RH', dp:'≤17°C', use:'Mission-critical (finance, government)' },
  { cls:'A2', temp:'10–35°C',  hum:'20–80% RH', dp:'≤21°C', use:'Enterprise data centers' },
  { cls:'A3', temp:'5–40°C',   hum:'8–85% RH',  dp:'≤24°C', use:'Cloud / HPC facilities' },
  { cls:'A4', temp:'5–45°C',   hum:'8–90% RH',  dp:'≤24°C', use:'Telecom / Edge / IoT' },
];

const REQS = [
  { icon:'🌡️', name:'IT Inlet Temperature', range:'15–32°C (A1)', cls:'A1/A2' },
  { icon:'💧', name:'Relative Humidity',     range:'20–80% RH',    cls:'A1/A2' },
  { icon:'⚡', name:'PUE (Energy Efficiency)', range:'≤ 1.5 (target <1.2)', cls:'ISO/ASHRAE' },
  { icon:'🌬️', name:'Airflow Velocity',      range:'≥ 2.5 m/s',    cls:'ASHRAE' },
  { icon:'🔁', name:'Temperature Delta (ΔT)', range:'≤ 20°C',      cls:'ASHRAE' },
];

const PRINCIPLES = [
  { name:'Thermal Zoning — Hot/Cold Aisle Containment', desc:'Physical separation of hot and cold airstreams minimizes recirculation and significantly improves cooling efficiency across the DC floor.' },
  { name:'IT Inlet Temperature Control', desc:'Air temperature at the IT equipment intake must comply with the ASHRAE class rating: A1 (15–32°C), A2 (10–35°C). Exceeding this voids equipment warranties.' },
  { name:'Humidity Management', desc:'Maintaining 20–80% RH and controlling dew point prevents condensation (too humid) and electrostatic discharge (too dry), both of which can damage equipment.' },
  { name:'PUE — Power Usage Effectiveness', desc:'PUE = Total facility power / IT equipment power. ASHRAE target: PUE ≤ 1.5. Industry best practice: PUE < 1.2. World-class hyperscale DCs achieve PUE < 1.1.' },
  { name:'Redundancy & Fault Tolerance (Tier I–IV)', desc:'Cooling system reliability aligned with Uptime Institute Tier levels. Redundant components (N, N+1, 2N) ensure uninterrupted IT operations during maintenance or failure events.' },
];

let step = 0;
let userData = {};
let results = [];

function setStep(n) {
  if (n > step + 1 || n < 0) return;
  step = n;
  renderStepper();
  renderScreen();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s, i) => {
    const cls = i < step ? 'done' : i === step ? 'active' : '';
    const ico = i < step ? '✓' : (i + 1);
    const dis = i > step + 1 ? 'disabled' : '';
    return `
      ${i > 0 ? '<div class="step-line"></div>' : ''}
      <button class="step ${cls}" onclick="setStep(${i})" ${dis} aria-label="Step ${i+1}: ${s.label}">
        <div class="step-dot">${ico}</div>
        <span class="step-name">${s.label}</span>
      </button>`;
  }).join('');
}

function renderScreen() {
  const el = document.getElementById('screen');
  const screens = [renderReq, renderPrinc, renderData, renderAnal, renderTable];
  el.innerHTML = screens[step]();
}

function renderReq() {
  const rows = CLASSES.map(c => `
    <tr>
      <td><span class="cls-badge">${c.cls}</span></td>
      <td style="color:var(--text)">${c.temp}</td>
      <td style="color:var(--text)">${c.hum}</td>
      <td style="color:var(--text2);font-size:11px;">${c.use}</td>
    </tr>`).join('');
  return `
    <h1 class="section-h">ASHRAE TC 9.9 Requirements</h1>
    <p class="section-sub">ASHRAE TC 9.9 is the technical committee that sets thermal guidelines for IT equipment in data centers. The standard defines 4 environmental classes based on operating conditions.</p>
    <div class="card">
      <div class="card-title">Key control parameters</div>
      <div class="req-grid">
        ${REQS.map(r => `
          <div class="req-tile">
            <div class="req-tile-icon">${r.icon}</div>
            <div class="req-tile-name">${r.name}</div>
            <div class="req-tile-range">${r.range}</div>
            <span class="req-tile-cls">${r.cls}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">ASHRAE environmental classes</div>
      <div style="overflow-x:auto;">
        <table class="cls-table">
          <thead><tr>
            <th>Class</th><th>Temperature</th><th>Humidity</th><th>Typical use</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-primary" onclick="setStep(1)">Next: 5 key principles →</button>
    </div>`;
}

function renderPrinc() {
  return `
    <h1 class="section-h">5 Key Principles of ASHRAE TC 9.9</h1>
    <p class="section-sub">These principles form the foundation for assessing compliance of any data center against the international ASHRAE standard.</p>
    <div class="card">
      <div class="card-title">Thermal management principles</div>
      <div class="principles">
        ${PRINCIPLES.map((p, i) => `
          <div class="principle">
            <div class="p-num">${i + 1}</div>
            <div>
              <div class="p-name">${p.name}</div>
              <div class="p-desc">${p.desc}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(0)">← Back</button>
      <button class="btn btn-primary" onclick="setStep(2)">Next: enter your data →</button>
    </div>`;
}

function renderData() {
  const fields = [
    { id:'temp',     label:'1. IT inlet air temperature',           unit:'°C',  hint:'ASHRAE A1 range: <span>15–32°C</span> | A2: <span>10–35°C</span>', ph:'e.g. 24' },
    { id:'humidity', label:'2. Relative humidity',                  unit:'% RH', hint:'ASHRAE range: <span>20–80% RH</span>', ph:'e.g. 45' },
    { id:'pue',      label:'3. PUE — Power Usage Effectiveness',    unit:'',    hint:'Target: <span>≤ 1.5</span> · Best practice: <span>< 1.2</span>', ph:'e.g. 1.4' },
    { id:'airflow',  label:'4. Airflow velocity between rack rows', unit:'m/s', hint:'ASHRAE minimum: <span>≥ 2.5 m/s</span>', ph:'e.g. 3.0' },
    { id:'delta_t',  label:'5. Supply / return temperature delta (ΔT)', unit:'°C', hint:'Allowable: <span>≤ 20°C</span> · Optimal: 10–15°C', ph:'e.g. 12' },
  ];
  return `
    <h1 class="section-h">Your Data Center Parameters</h1>
    <p class="section-sub">Enter your real measured values. All fields are required to generate the compliance analysis.</p>
    <div class="card">
      <div class="card-title">Input parameters</div>
      ${fields.map(f => `
        <div class="form-block">
          <label class="form-label" for="inp_${f.id}"><strong>${f.label}</strong></label>
          <div class="input-row">
            <input type="number" id="inp_${f.id}" placeholder="${f.ph}" step="0.1" value="${userData[f.id] || ''}">
            ${f.unit ? `<span class="input-unit">${f.unit}</span>` : ''}
          </div>
          <div class="input-hint">${f.hint}</div>
        </div>`).join('')}
      <button class="btn btn-primary" onclick="collectAndAnalyze()">Run compliance analysis →</button>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(1)">← Back</button>
    </div>`;
}

function collectAndAnalyze() {
  const ids = ['temp','humidity','pue','airflow','delta_t'];
  const empty = ids.filter(id => !document.getElementById('inp_'+id).value);
  if (empty.length) { alert('Please fill in all fields to proceed.'); return; }
  ids.forEach(id => userData[id] = parseFloat(document.getElementById('inp_'+id).value));
  computeResults();
  setStep(3);
}

function computeResults() {
  const u = userData;
  results = [
    {
      param:'IT Inlet Temperature', ashrae:'15–32°C', real:u.temp, unit:'°C',
      ok: u.temp >= 15 && u.temp <= 32,
      warn: (u.temp >= 13 && u.temp < 15) || (u.temp > 32 && u.temp <= 35),
      dev: u.temp < 15 ? (u.temp-15).toFixed(1) : u.temp > 32 ? '+' + (u.temp-32).toFixed(1) : '0',
      principle:'IT Inlet Temp Control'
    },
    {
      param:'Relative Humidity', ashrae:'20–80% RH', real:u.humidity, unit:'%',
      ok: u.humidity >= 20 && u.humidity <= 80,
      warn: (u.humidity >= 15 && u.humidity < 20) || (u.humidity > 80 && u.humidity <= 85),
      dev: u.humidity < 20 ? (u.humidity-20).toFixed(1) : u.humidity > 80 ? '+' + (u.humidity-80).toFixed(1) : '0',
      principle:'Humidity Management'
    },
    {
      param:'PUE', ashrae:'≤ 1.5', real:u.pue, unit:'',
      ok: u.pue <= 1.5,
      warn: u.pue > 1.5 && u.pue <= 1.8,
      dev: u.pue > 1.5 ? '+' + (u.pue-1.5).toFixed(2) : u.pue <= 1.2 ? '-' + (1.5-u.pue).toFixed(2) : '0',
      principle:'Power Usage Effectiveness'
    },
    {
      param:'Airflow Velocity', ashrae:'≥ 2.5 m/s', real:u.airflow, unit:'m/s',
      ok: u.airflow >= 2.5,
      warn: u.airflow >= 2.0 && u.airflow < 2.5,
      dev: u.airflow < 2.5 ? (u.airflow-2.5).toFixed(1) : '0',
      principle:'Hot/Cold Aisle Containment'
    },
    {
      param:'Temperature Delta ΔT', ashrae:'≤ 20°C', real:u.delta_t, unit:'°C',
      ok: u.delta_t <= 20,
      warn: u.delta_t > 20 && u.delta_t <= 25,
      dev: u.delta_t > 20 ? '+' + (u.delta_t-20).toFixed(1) : '0',
      principle:'Thermal Zoning'
    }
  ];
}

function getStatus(r) {
  if (r.ok) return { cls:'st-ok', label:'✓ Compliant' };
  if (r.warn) return { cls:'st-warn', label:'! Warning' };
  return { cls:'st-fail', label:'✗ Non-compliant' };
}

function renderAnal() {
  const okC = results.filter(r => r.ok).length;
  const warnC = results.filter(r => !r.ok && r.warn).length;
  const failC = results.filter(r => !r.ok && !r.warn).length;
  const score = Math.round((okC * 100 + warnC * 50) / results.length);
  const scoreColor = score >= 80 ? 'var(--green)' : score >= 50 ? 'var(--amber)' : 'var(--red)';

  const cards = results.map(r => {
    const s = getStatus(r);
    const devCls = r.dev === '0' ? 'dev-zero' : r.dev.startsWith('+') ? 'dev-neg' : 'dev-pos';
    return `
      <div class="result-card">
        <div class="rc-head">
          <div>
            <div class="rc-title">${r.param}</div>
            <div class="rc-principle">Principle: ${r.principle}</div>
          </div>
          <span class="status-badge ${s.cls}">${s.label}</span>
        </div>
        <div class="rc-cols">
          <div class="rc-col">
            <div class="rc-col-label">ASHRAE Requirement</div>
            <div class="rc-col-val" style="font-size:13px;color:var(--text2);">${r.ashrae}</div>
          </div>
          <div class="rc-col">
            <div class="rc-col-label">Actual Value</div>
            <div class="rc-col-val">${r.real}${r.unit}</div>
          </div>
          <div class="rc-col">
            <div class="rc-col-label">Deviation</div>
            <div class="rc-col-val ${devCls}">${r.dev}${r.dev !== '0' ? r.unit : ''}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <h1 class="section-h">Analysis Results</h1>
    <p class="section-sub">Comparison of your data center's actual readings against ASHRAE TC 9.9 Class A1/A2 thresholds.</p>
    <div class="card">
      <div class="card-title">Overall compliance</div>
      <div class="summary-row">
        <div class="sum-tile sum-ok"><div class="num">${okC}</div><div class="lbl">Compliant</div></div>
        <div class="sum-tile sum-warn"><div class="num">${warnC}</div><div class="lbl">Warning</div></div>
        <div class="sum-tile sum-fail"><div class="num">${failC}</div><div class="lbl">Non-compliant</div></div>
      </div>
      <div class="score-line">
        <span>Compliance score</span>
        <span style="color:${scoreColor};font-weight:700;">${score}%</span>
      </div>
      <div class="score-track">
        <div class="score-fill" style="width:${score}%;background:${scoreColor};"></div>
      </div>
    </div>
    ${cards}
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(2)">← Edit inputs</button>
      <button class="btn btn-primary" onclick="setStep(4)">Final report →</button>
    </div>`;
}

function renderTable() {
  const okC = results.filter(r => r.ok).length;
  const warnC = results.filter(r => !r.ok && r.warn).length;
  const score = Math.round((okC * 100 + warnC * 50) / results.length);
  const scoreColor = score >= 80 ? 'var(--green)' : score >= 50 ? 'var(--amber)' : 'var(--red)';
  const scoreLabel = score >= 80 ? 'Compliant with ASHRAE TC 9.9' : score >= 50 ? 'Partial compliance — action required' : 'Critical violations — immediate action required';
  const today = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });

  const rows = results.map(r => {
    const s = getStatus(r);
    const devCls = r.dev === '0' ? 'dev-zero' : r.dev.startsWith('+') ? 'dev-neg' : 'dev-pos';
    return `
      <tr>
        <td style="font-weight:500;">${r.param}</td>
        <td style="color:var(--text2);font-family:var(--mono);font-size:11px;">${r.ashrae}</td>
        <td style="font-family:var(--mono);font-weight:500;">${r.real}${r.unit}</td>
        <td style="font-family:var(--mono);" class="${devCls}">${r.dev !== '0' ? r.dev + r.unit : '—'}</td>
        <td><span class="status-badge ${s.cls}">${s.label}</span></td>
      </tr>`;
  }).join('');

  return `
    <h1 class="section-h">Compliance Report</h1>
    <p class="section-sub">Final comparison table of your data center against ASHRAE TC 9.9 requirements. Assessment date: ${today}.</p>
    <div class="card">
      <div class="final-meta">
        <div class="final-score" style="color:${scoreColor};">${score}%</div>
        <div>
          <div class="final-score-label" style="color:${scoreColor};">${scoreLabel}</div>
          <div class="final-score-sub">Standard: ASHRAE TC 9.9 · Class A1/A2 · ${today}</div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="comp-table">
          <thead>
            <tr>
              <th style="width:28%;">Parameter</th>
              <th style="width:22%;">ASHRAE Requirement</th>
              <th style="width:16%;">Actual</th>
              <th style="width:14%;">Deviation</th>
              <th style="width:20%;">Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="note" style="border-top:1px solid var(--border);padding-top:14px;">
        Source: ASHRAE TC 9.9 "Thermal Guidelines for Data Processing Environments", 4th Edition.<br>
        Legend: ✓ Compliant — within tolerance · ! Warning — minor deviation · ✗ Non-compliant — critical exceedance.<br>
        A full energy audit per EN 50600 and ISO/IEC 30134 is recommended alongside this assessment.
      </p>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(2)">← Re-enter data</button>
      <button class="btn btn-primary" onclick="window.print()">🖨 Print report</button>
    </div>`;
}

renderStepper();
renderScreen();
</script>
</body>
</html>
