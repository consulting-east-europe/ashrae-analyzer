<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHRAE TC 9.9 — Аналізатор дата-центру</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0D0F14;
  --bg2: #13161E;
  --bg3: #1A1E28;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #E8EAF0;
  --text2: #8A8FA0;
  --text3: #555A6A;
  --blue: #4B8EF5;
  --blue-dim: rgba(75,142,245,0.12);
  --blue-border: rgba(75,142,245,0.3);
  --green: #3ECF8E;
  --green-dim: rgba(62,207,142,0.1);
  --amber: #F5A623;
  --amber-dim: rgba(245,166,35,0.1);
  --red: #F5564A;
  --red-dim: rgba(245,86,74,0.1);
  --mono: 'DM Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 10px;
  --radius-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  line-height: 1.6;
}

/* LAYOUT */
.shell { max-width: 780px; margin: 0 auto; padding: 0 20px 80px; }

/* HEADER */
.site-header {
  padding: 40px 20px 0;
  max-width: 780px;
  margin: 0 auto 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 36px; height: 36px;
  background: var(--blue);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 20px; height: 20px; fill: #fff; }
.logo-text { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.logo-sub { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-top: 1px; }
.version-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--blue);
  background: var(--blue-dim);
  border: 1px solid var(--blue-border);
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}

/* STEPPER */
.stepper {
  display: flex;
  align-items: center;
  margin-bottom: 32px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }
.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 64px;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  transition: opacity 0.2s;
}
.step:disabled { cursor: not-allowed; opacity: 0.4; }
.step-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  transition: all 0.25s;
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
}
.step.active .step-dot {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  box-shadow: 0 0 16px rgba(75,142,245,0.4);
}
.step.done .step-dot {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}
.step-name { font-size: 10px; font-family: var(--mono); color: var(--text3); white-space: nowrap; }
.step.active .step-name { color: var(--blue); }
.step.done .step-name { color: var(--green); }
.step-line { flex: 1; height: 1px; background: var(--border); min-width: 12px; max-width: 40px; margin-bottom: 18px; }

/* CARDS */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 16px;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-title {
  font-size: 13px;
  font-family: var(--mono);
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::before {
  content: '';
  display: block;
  width: 3px; height: 14px;
  background: var(--blue);
  border-radius: 2px;
}

/* SECTION HEADING */
.section-h {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.section-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.5; }

/* REQUIREMENT GRID */
.req-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.req-tile {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.req-tile-icon { font-size: 20px; margin-bottom: 8px; }
.req-tile-name { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-bottom: 4px; }
.req-tile-range { font-size: 13px; font-weight: 500; color: var(--text); }
.req-tile-cls {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--blue);
  background: var(--blue-dim);
  border: 1px solid var(--blue-border);
  padding: 1px 6px;
  border-radius: 4px;
  margin-top: 6px;
}

/* CLASS TABLE */
.cls-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cls-table th {
  text-align: left;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
}
.cls-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.cls-table tr:last-child td { border-bottom: none; }
.cls-table tr:hover td { background: var(--bg3); }
.cls-badge {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--blue);
}

/* PRINCIPLES */
.principles { display: flex; flex-direction: column; gap: 10px; }
.principle {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: border-color 0.2s;
}
.principle:hover { border-color: var(--border2); }
.p-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blue-dim);
  border: 1px solid var(--blue-border);
  color: var(--blue);
  font-family: var(--mono);
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.p-name { font-size: 13px; font-weight: 500; color: var(--text); }
.p-desc { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.5; }

/* FORM */
.form-block { margin-bottom: 20px; }
.form-label { font-size: 12px; font-family: var(--mono); color: var(--text2); margin-bottom: 8px; display: block; }
.form-label strong { color: var(--text); font-weight: 500; }
.input-row { display: flex; align-items: center; gap: 10px; }
.input-row input {
  width: 140px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.input-row input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(75,142,245,0.12); }
.input-unit { font-family: var(--mono); font-size: 12px; color: var(--text3); }
.input-hint { font-size: 11px; color: var(--text3); margin-top: 5px; font-family: var(--mono); }
.input-hint span { color: var(--blue); }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--blue);
  color: #fff;
  width: 100%;
  justify-content: center;
  margin-top: 8px;
}
.btn-primary:hover { background: #6BA4F7; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(75,142,245,0.3); }
.btn-ghost {
  background: var(--bg3);
  color: var(--text2);
  border: 1px solid var(--border2);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border); }
.nav-row { display: flex; gap: 10px; margin-top: 16px; }
.nav-row .btn-primary { flex: 1; }

/* RESULTS */
.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.sum-tile {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
}
.sum-tile .num { font-size: 28px; font-weight: 700; font-family: var(--mono); }
.sum-tile .lbl { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
.sum-ok .num { color: var(--green); }
.sum-warn .num { color: var(--amber); }
.sum-fail .num { color: var(--red); }

.score-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text2);
}
.score-track {
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 20px;
}
.score-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

.result-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.result-card:hover { border-color: var(--border2); }
.rc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.rc-title { font-size: 13px; font-weight: 500; }
.rc-principle { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-top: 2px; }
.status-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 20px;
  font-weight: 500;
  white-space: nowrap;
}
.st-ok { background: rgba(62,207,142,0.12); color: var(--green); border: 1px solid rgba(62,207,142,0.25); }
.st-warn { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,166,35,0.25); }
.st-fail { background: var(--red-dim); color: var(--red); border: 1px solid rgba(245,86,74,0.25); }
.rc-cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.rc-col {
  background: var(--bg2);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}
.rc-col-label { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-bottom: 4px; }
.rc-col-val { font-size: 16px; font-weight: 700; font-family: var(--mono); }
.dev-pos { color: var(--green); }
.dev-neg { color: var(--red); }
.dev-zero { color: var(--text3); }

/* FINAL TABLE */
.final-meta {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}
.final-score { font-size: 40px; font-weight: 700; font-family: var(--mono); }
.final-score-label { font-size: 13px; font-weight: 500; }
.final-score-sub { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-top: 3px; }

.comp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.comp-table th {
  text-align: left;
  padding: 9px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.comp-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
.comp-table tr:last-child td { border-bottom: none; }
.comp-table tr:hover td { background: rgba(255,255,255,0.02); }
.comp-table .note { font-size: 11px; font-family: var(--mono); color: var(--text3); margin-top: 14px; line-height: 1.6; }

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  margin-top: 60px;
  padding: 24px 20px;
  max-width: 780px;
  margin-left: auto;
  margin-right: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
footer p { font-size: 11px; font-family: var(--mono); color: var(--text3); }

/* RESPONSIVE */
@media (max-width: 520px) {
  .req-grid { grid-template-columns: repeat(2, 1fr); }
  .rc-cols { grid-template-columns: repeat(3, 1fr); }
  .summary-row { grid-template-columns: repeat(3, 1fr); }
  .final-meta { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">DC Compliance Analyzer</div>
      <div class="logo-sub">ASHRAE TC 9.9 · Thermal Guidelines</div>
    </div>
  </div>
  <span class="version-tag">v1.0 · 2024</span>
</header>

<main class="shell">

  <!-- STEPPER -->
  <nav class="stepper" id="stepper" aria-label="Кроки аналізу"></nav>

  <!-- SCREEN -->
  <div id="screen"></div>

</main>

<footer>
  <p>ASHRAE TC 9.9 Thermal Guidelines for Data Processing Environments, 4th Edition</p>
  <p>Розроблено для LinkedIn · Відкрите використання</p>
</footer>

<script>
const STEPS = [
  { key:'req',   label:'Вимоги' },
  { key:'princ', label:'Принципи' },
  { key:'data',  label:'Ваші дані' },
  { key:'anal',  label:'Аналіз' },
  { key:'table', label:'Підсумок' },
];

const CLASSES = [
  { cls:'A1', temp:'15–32°C',  hum:'20–80% RH', dp:'≤17°C', use:'Критична інфраструктура (банки, держ.)' },
  { cls:'A2', temp:'10–35°C',  hum:'20–80% RH', dp:'≤21°C', use:'Корпоративні ЦОД' },
  { cls:'A3', temp:'5–40°C',   hum:'8–85% RH',  dp:'≤24°C', use:'Хмарні / HPC центри' },
  { cls:'A4', temp:'5–45°C',   hum:'8–90% RH',  dp:'≤24°C', use:'Telecom / Edge / IoT' },
];

const REQS = [
  { icon:'🌡️', name:'Температура на вході', range:'15–32°C (A1)', cls:'A1/A2' },
  { icon:'💧', name:'Відносна вологість',    range:'20–80% RH',    cls:'A1/A2' },
  { icon:'⚡', name:'PUE (енергоефективн.)', range:'≤ 1.5 (ціль <1.2)', cls:'ISO/ASHRAE' },
  { icon:'🌬️', name:'Швидкість повітря',     range:'≥ 2.5 м/с',    cls:'ASHRAE' },
  { icon:'🔁', name:'Різниця темп. ΔT',      range:'≤ 20°C',       cls:'ASHRAE' },
];

const PRINCIPLES = [
  { name:'Теплове зонування (Hot/Cold Aisle)', desc:'Розділення гарячих та холодних коридорів для мінімізації рециркуляції тепла та підвищення ефективності охолодження.' },
  { name:'Контроль мікроклімату (IT Inlet Temp)', desc:'Температура повітря на вході до ІТ-обладнання відповідно до класу ASHRAE A1: 15–32°C, A2: 10–35°C.' },
  { name:'Управління вологістю', desc:'Підтримка відносної вологості 20–80% RH та точки роси для запобігання конденсату та статичній електриці.' },
  { name:'PUE — ефективність використання енергії', desc:'Power Usage Effectiveness = загальна потужність ЦОД / потужність ІТ. Ціль ASHRAE: PUE < 1.5, кращі практики: < 1.2.' },
  { name:'Резервування та відмовостійкість систем', desc:'Надійність охолодження за рівнями Tier I–IV: резервні компоненти (N, N+1, 2N) для безперервної роботи ІТ.' },
];

let step = 0;
let userData = {};
let results = [];

function setStep(n) {
  if (n > step + 1 || n < 0) return;
  step = n;
  renderStepper();
  renderScreen();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s, i) => {
    const cls = i < step ? 'done' : i === step ? 'active' : '';
    const ico = i < step ? '✓' : (i + 1);
    const dis = i > step + 1 ? 'disabled' : '';
    return `
      ${i > 0 ? '<div class="step-line"></div>' : ''}
      <button class="step ${cls}" onclick="setStep(${i})" ${dis} aria-label="Крок ${i+1}: ${s.label}">
        <div class="step-dot">${ico}</div>
        <span class="step-name">${s.label}</span>
      </button>`;
  }).join('');
}

function renderScreen() {
  const el = document.getElementById('screen');
  const screens = [renderReq, renderPrinc, renderData, renderAnal, renderTable];
  el.innerHTML = screens[step]();
}

/* ---- STEP 0 ---- */
function renderReq() {
  const rows = CLASSES.map(c => `
    <tr>
      <td><span class="cls-badge">${c.cls}</span></td>
      <td style="color:var(--text)">${c.temp}</td>
      <td style="color:var(--text)">${c.hum}</td>
      <td style="color:var(--text2);font-size:11px;">${c.use}</td>
    </tr>`).join('');
  return `
    <h1 class="section-h">Вимоги ASHRAE TC 9.9</h1>
    <p class="section-sub">ASHRAE TC 9.9 — технічний комітет, що визначає теплові умови для ІТ-обладнання в дата-центрах. Стандарт виділяє 4 класи оточуючого середовища.</p>
    <div class="card">
      <div class="card-title">Ключові показники контролю</div>
      <div class="req-grid">
        ${REQS.map(r => `
          <div class="req-tile">
            <div class="req-tile-icon">${r.icon}</div>
            <div class="req-tile-name">${r.name}</div>
            <div class="req-tile-range">${r.range}</div>
            <span class="req-tile-cls">${r.cls}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Класи оточуючого середовища ASHRAE</div>
      <div style="overflow-x:auto;">
        <table class="cls-table">
          <thead><tr>
            <th>Клас</th><th>Температура</th><th>Вологість</th><th>Застосування</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-primary" onclick="setStep(1)">Далі: 5 принципів →</button>
    </div>`;
}

/* ---- STEP 1 ---- */
function renderPrinc() {
  return `
    <h1 class="section-h">5 ключових принципів ASHRAE TC 9.9</h1>
    <p class="section-sub">Ці принципи є фундаментом для оцінки відповідності будь-якого дата-центру міжнародному стандарту.</p>
    <div class="card">
      <div class="card-title">Принципи теплового управління</div>
      <div class="principles">
        ${PRINCIPLES.map((p, i) => `
          <div class="principle">
            <div class="p-num">${i + 1}</div>
            <div>
              <div class="p-name">${p.name}</div>
              <div class="p-desc">${p.desc}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(0)">← Назад</button>
      <button class="btn btn-primary" onclick="setStep(2)">Далі: ввести дані →</button>
    </div>`;
}

/* ---- STEP 2 ---- */
function renderData() {
  const fields = [
    { id:'temp',    label:'1. Температура повітря на вході', unit:'°C',  hint:'Норма ASHRAE A1: <span>15–32°C</span> | A2: <span>10–35°C</span>', ph:'напр. 24' },
    { id:'humidity',label:'2. Відносна вологість',           unit:'% RH', hint:'Норма ASHRAE: <span>20–80% RH</span>', ph:'напр. 45' },
    { id:'pue',     label:'3. PUE — коефіцієнт енергоефективності', unit:'',  hint:'Ціль: <span>≤ 1.5</span>, найкраще: <span>< 1.2</span>', ph:'напр. 1.4' },
    { id:'airflow', label:'4. Швидкість повітряного потоку між стійками', unit:'м/с', hint:'Мінімум ASHRAE: <span>≥ 2.5 м/с</span>', ph:'напр. 3.0' },
    { id:'delta_t', label:'5. Різниця температур подачі та повернення (ΔT)', unit:'°C', hint:'Допустимо: <span>≤ 20°C</span>, оптимально 10–15°C', ph:'напр. 12' },
  ];
  return `
    <h1 class="section-h">Параметри вашого дата-центру</h1>
    <p class="section-sub">Введіть реальні вимірювані показники. Всі поля обов'язкові для проведення аналізу.</p>
    <div class="card">
      <div class="card-title">Вхідні дані для аналізу</div>
      ${fields.map(f => `
        <div class="form-block">
          <label class="form-label" for="inp_${f.id}"><strong>${f.label}</strong></label>
          <div class="input-row">
            <input type="number" id="inp_${f.id}" placeholder="${f.ph}" step="0.1" value="${userData[f.id] || ''}">
            ${f.unit ? `<span class="input-unit">${f.unit}</span>` : ''}
          </div>
          <div class="input-hint">${f.hint}</div>
        </div>`).join('')}
      <button class="btn btn-primary" onclick="collectAndAnalyze()">Провести аналіз →</button>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(1)">← Назад</button>
    </div>`;
}

function collectAndAnalyze() {
  const ids = ['temp','humidity','pue','airflow','delta_t'];
  const empty = ids.filter(id => !document.getElementById('inp_'+id).value);
  if (empty.length) { alert('Будь ласка, заповніть всі поля'); return; }
  ids.forEach(id => userData[id] = parseFloat(document.getElementById('inp_'+id).value));
  computeResults();
  setStep(3);
}

function computeResults() {
  const u = userData;
  results = [
    {
      param:'Температура повітря', ashrae:'15–32°C', real:u.temp, unit:'°C',
      ok: u.temp >= 15 && u.temp <= 32,
      warn: (u.temp >= 13 && u.temp < 15) || (u.temp > 32 && u.temp <= 35),
      dev: u.temp < 15 ? (u.temp-15).toFixed(1) : u.temp > 32 ? '+' + (u.temp-32).toFixed(1) : '0',
      principle:'IT Inlet Temp'
    },
    {
      param:'Відносна вологість', ashrae:'20–80% RH', real:u.humidity, unit:'%',
      ok: u.humidity >= 20 && u.humidity <= 80,
      warn: (u.humidity >= 15 && u.humidity < 20) || (u.humidity > 80 && u.humidity <= 85),
      dev: u.humidity < 20 ? (u.humidity-20).toFixed(1) : u.humidity > 80 ? '+' + (u.humidity-80).toFixed(1) : '0',
      principle:'Управління вологістю'
    },
    {
      param:'PUE', ashrae:'≤ 1.5', real:u.pue, unit:'',
      ok: u.pue <= 1.5,
      warn: u.pue > 1.5 && u.pue <= 1.8,
      dev: u.pue > 1.5 ? '+' + (u.pue-1.5).toFixed(2) : u.pue <= 1.2 ? '-' + (1.5-u.pue).toFixed(2) : '0',
      principle:'Енергоефективність'
    },
    {
      param:'Швидкість повітря', ashrae:'≥ 2.5 м/с', real:u.airflow, unit:'м/с',
      ok: u.airflow >= 2.5,
      warn: u.airflow >= 2.0 && u.airflow < 2.5,
      dev: u.airflow < 2.5 ? (u.airflow-2.5).toFixed(1) : '0',
      principle:'Hot/Cold Aisle'
    },
    {
      param:'Різниця ΔT', ashrae:'≤ 20°C', real:u.delta_t, unit:'°C',
      ok: u.delta_t <= 20,
      warn: u.delta_t > 20 && u.delta_t <= 25,
      dev: u.delta_t > 20 ? '+' + (u.delta_t-20).toFixed(1) : '0',
      principle:'Теплове зонування'
    }
  ];
}

function getStatus(r) {
  if (r.ok) return { cls:'st-ok', label:'✓ Норма' };
  if (r.warn) return { cls:'st-warn', label:'! Увага' };
  return { cls:'st-fail', label:'✗ Порушення' };
}

/* ---- STEP 3 ---- */
function renderAnal() {
  const okC = results.filter(r => r.ok).length;
  const warnC = results.filter(r => !r.ok && r.warn).length;
  const failC = results.filter(r => !r.ok && !r.warn).length;
  const score = Math.round((okC * 100 + warnC * 50) / results.length);
  const scoreColor = score >= 80 ? 'var(--green)' : score >= 50 ? 'var(--amber)' : 'var(--red)';

  const cards = results.map(r => {
    const s = getStatus(r);
    const devCls = r.dev === '0' ? 'dev-zero' : r.dev.startsWith('+') ? 'dev-neg' : 'dev-pos';
    return `
      <div class="result-card">
        <div class="rc-head">
          <div>
            <div class="rc-title">${r.param}</div>
            <div class="rc-principle">Принцип: ${r.principle}</div>
          </div>
          <span class="status-badge ${s.cls}">${s.label}</span>
        </div>
        <div class="rc-cols">
          <div class="rc-col">
            <div class="rc-col-label">Вимога ASHRAE</div>
            <div class="rc-col-val" style="font-size:13px;color:var(--text2);">${r.ashrae}</div>
          </div>
          <div class="rc-col">
            <div class="rc-col-label">Реальний</div>
            <div class="rc-col-val">${r.real}${r.unit}</div>
          </div>
          <div class="rc-col">
            <div class="rc-col-label">Відхилення</div>
            <div class="rc-col-val ${devCls}">${r.dev}${r.dev !== '0' ? r.unit : ''}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <h1 class="section-h">Результати аналізу</h1>
    <p class="section-sub">Порівняння реальних показників вашого дата-центру з вимогами ASHRAE TC 9.9 (клас A1/A2).</p>
    <div class="card">
      <div class="card-title">Загальна відповідність</div>
      <div class="summary-row">
        <div class="sum-tile sum-ok"><div class="num">${okC}</div><div class="lbl">В нормі</div></div>
        <div class="sum-tile sum-warn"><div class="num">${warnC}</div><div class="lbl">Увага</div></div>
        <div class="sum-tile sum-fail"><div class="num">${failC}</div><div class="lbl">Порушення</div></div>
      </div>
      <div class="score-line">
        <span>Відповідність стандарту</span>
        <span style="color:${scoreColor};font-weight:700;">${score}%</span>
      </div>
      <div class="score-track">
        <div class="score-fill" style="width:${score}%;background:${scoreColor};"></div>
      </div>
    </div>
    ${cards}
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(2)">← Змінити дані</button>
      <button class="btn btn-primary" onclick="setStep(4)">Фінальна таблиця →</button>
    </div>`;
}

/* ---- STEP 4 ---- */
function renderTable() {
  const okC = results.filter(r => r.ok).length;
  const warnC = results.filter(r => !r.ok && r.warn).length;
  const score = Math.round((okC * 100 + warnC * 50) / results.length);
  const scoreColor = score >= 80 ? 'var(--green)' : score >= 50 ? 'var(--amber)' : 'var(--red)';
  const scoreLabel = score >= 80 ? 'Відповідає ASHRAE TC 9.9' : score >= 50 ? 'Часткова відповідність' : 'Критичні порушення';
  const today = new Date().toLocaleDateString('uk-UA');

  const rows = results.map(r => {
    const s = getStatus(r);
    const devCls = r.dev === '0' ? 'dev-zero' : r.dev.startsWith('+') ? 'dev-neg' : 'dev-pos';
    return `
      <tr>
        <td style="font-weight:500;">${r.param}</td>
        <td style="color:var(--text2);font-family:var(--mono);font-size:11px;">${r.ashrae}</td>
        <td style="font-family:var(--mono);font-weight:500;">${r.real}${r.unit}</td>
        <td style="font-family:var(--mono);" class="${devCls}">${r.dev}${r.dev !== '0' ? r.unit : '—'}</td>
        <td><span class="status-badge ${s.cls}">${s.label}</span></td>
      </tr>`;
  }).join('');

  return `
    <h1 class="section-h">Підсумкова порівняльна таблиця</h1>
    <p class="section-sub">Фінальний звіт відповідності дата-центру стандарту ASHRAE TC 9.9. Дата оцінки: ${today}.</p>
    <div class="card">
      <div class="final-meta">
        <div class="final-score" style="color:${scoreColor};">${score}%</div>
        <div>
          <div class="final-score-label" style="color:${scoreColor};">${scoreLabel}</div>
          <div class="final-score-sub">Стандарт: ASHRAE TC 9.9 · Клас A1/A2 · ${today}</div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="comp-table">
          <thead>
            <tr>
              <th style="width:28%;">Показник</th>
              <th style="width:22%;">Вимога ASHRAE</th>
              <th style="width:16%;">Реальний</th>
              <th style="width:14%;">Відхилення</th>
              <th style="width:20%;">Статус</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="note" style="border-top:1px solid var(--border);padding-top:14px;">
        Джерело: ASHRAE TC 9.9 «Thermal Guidelines for Data Processing Environments», 4th Edition.<br>
        Легенда: ✓ Норма — в межах допуску · ! Увага — незначне відхилення · ✗ Порушення — критичне перевищення.<br>
        Рекомендується провести повний енергоаудит за стандартами EN 50600 та ISO/IEC 30134.
      </p>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="setStep(2)">← Переввести дані</button>
      <button class="btn btn-primary" onclick="window.print()">🖨 Роздрукувати звіт</button>
    </div>`;
}

/* INIT */
renderStepper();
renderScreen();
</script>
</body>
</html>
